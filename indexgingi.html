const tx=4.5*S(16,19)+2.5*S(22.5,25)-7*S(27.5,29.5),y=2.2-1.45*S(6.5,8.5)+1.45*S(10,13)-.6*S(19,20)+.6*S(27.5,28.5);
basket.position.set(tx,y,0);trol.position.x=tx;
const ch=y+1.2;link(chn,tx,3.5,0,tx,ch,0);hook.position.set(tx,ch-.04,0);scb.position.set(tx,y+1.0,0);dsp.position.set(tx,y+1.0,.047);ring.position.set(tx,y+.86,0);
[[-.5,-.45],[.5,-.45],[-.5,.45],[.5,.45]].forEach((c,i)=>link(sl[i],tx,y+.84,0,tx+c[0],y+.35,c[1]));
const sc=S(0,.3)*(1-S(27.3,27.8)),s=S(8.5,10),ag=S(.8,1.5)*(1-S(7,8));
gi.forEach(g=>{const fy=L(2.8,1.03+.012*Math.sin(tm*2+g.r),S(0,1.5));
g.m.position.set(L(g.fx,tx+g.lx,s),L(fy,y+g.ly,s),L(g.fz,g.lz,s));g.m.rotation.set(.3*Math.sin(tm+g.r)*(1-s),g.r+tm*.15*(1-s),.2*Math.cos(tm*1.3+g.r)*(1-s));g.m.scale.setScalar(sc)});
ro.forEach(r=>{const u=S(5+r.d,8.5+r.d),x=L(r.x0,r.tx,u),yb=x<1.7?.39-.176*x+r.h*.3:.1+r.h;
r.m.position.set(x,2.8-1.8*S(0,1.2)-(1-yb)*S(1.2,3.5),L(r.z0,r.tz,u));r.m.rotation.set(r.r+tm*(1-S(1.2,3.5)),r.r,0);r.m.scale.setScalar(r.s*sc)});
const a=.007+.025*ag;for(let i=0;i<wp.count;i++){const x=wp.getX(i),z=wp.getZ(i);wp.setY(i,a*Math.sin(x*4+tm*2.5)+a*.8*Math.cos(z*6+tm*2))}wp.needsUpdate=true;wat.geometry.computeVertexNormals();
bub(tm>1&&tm<8,0,.15,0,0,1,0,.85,.35);drip(tm>12.5&&tm<16.5,tx,y-.4,0,0,-1,0,.9,1.2);spr(tm>19.8&&tm<22.5,4.5,2.1,0,0,-1,0,1.05,1.5);air(tm>23&&tm<27.3,7,1.58,-1.15,0,0,1,2,1.4);
setS(tm<10.5?'0.0':tm<13?(186*S(10.5,12.5)).toFixed(1):tm<16?'186.0':tm<27.3?'181.4':'0.0');
let si=stages.findIndex(q=>tm>=q[0]&&tm<q[1]);if(si!==lastSt){lastSt=si;const q=stages[si];stEl.innerHTML=q[2]+'<small>'+q[3]+'</small>'}
scEl.textContent=tm<10.5?'0.0 kg':tm<13?(186*S(10.5,12.5)).toFixed(1)+' kg':tm<16?'186.0 kg':tm<27.3?'NET 181.4 kg (−2.5%)':'20 kg / กล่อง'}
// camera
const cam=new THREE.PerspectiveCamera(40,1,.1,100);let th=.45,ph=.42,rad=innerWidth<700?22:16;const tgt=new THREE.Vector3(3.5,1.4,0);
function cm(){cam.position.set(tgt.x+rad*Math.sin(th)*Math.cos(ph),tgt.y+rad*Math.sin(ph),tgt.z+rad*Math.cos(th)*Math.cos(ph));cam.lookAt(tgt)}
function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
let dr=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{dr=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointerup',()=>dr=false);
cv.addEventListener('pointermove',e=>{if(!dr)return;th-=(e.clientX-lx)*.006;ph=Math.min(1.3,Math.max(.05,ph+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(32,Math.max(6,rad*(1+e.deltaY*.001)))},{passive:false});
let playing=true,last=performance.now();const pp=document.getElementById('pp');
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'⏸ หยุด':'▶ เล่น'};
(function f(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing)tm=(tm+dt)%30;update();cm();ren.render(scene,cam);requestAnimationFrame(f)})(last);
</script></body></html>
